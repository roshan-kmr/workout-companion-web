<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Workout Companion is a mobile-friendly gym planner with progress tracking, workout logs, and backup controls." />
    <title>Workout Companion</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Athlete</p>
          <h1 id="headerUserName">Workout Companion</h1>
        </div>
        <div class="topbar-actions">
          <button class="tab-toggle active" data-tab="workout">Active workout</button>
          <button class="tab-toggle" data-tab="data">Data & backup</button>
        </div>
      </header>

      <main>
        <section id="workoutView" class="tab-view active">
          <div class="panel main-panel">
            <div class="user-row">
              <label class="user-label" for="userNameInput">User name</label>
              <input id="userNameInput" class="user-name-input" type="text" placeholder="Enter your name" maxlength="40" />
            </div>

            <div class="day-row">
              <div>
                <p class="section-label">Workout day</p>
                <div id="daySelector" class="day-selector"></div>
              </div>
              <button id="startBtn" class="primary-btn">Start workout</button>
            </div>

            <div id="statsGrid" class="stats-grid"></div>

            <div id="sessionCard" class="session-card"></div>
          </div>
        </section>

        <section id="dataView" class="tab-view hidden">
          <div class="panel side-panel">
            <div class="panel-head">
              <h2>Data & backup</h2>
            </div>

            <div class="data-actions">
              <button id="openFileBtn" class="secondary-btn">Open data file</button>
              <button id="exportBtn" class="secondary-btn">Export</button>
              <button id="importBtn" class="secondary-btn">Import</button>
              <button id="saveNowBtn" class="secondary-btn">Save active file</button>
              <button id="resetBtn" class="secondary-btn danger-btn">Reset</button>
            </div>

            <div class="mini-card">
              <h3>Weekly summary</h3>
              <div id="weeklySummary" class="summary-box"></div>
            </div>

            <div class="mini-card">
              <h3>PRs</h3>
              <ul id="prList" class="pr-list"></ul>
            </div>

            <div class="mini-card">
              <h3>Backup status</h3>
              <div id="backupStatus" class="status-box"></div>
            </div>

            <div class="mini-card">
              <h3>Recent log</h3>
              <ul id="recentLog" class="log-list"></ul>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("sw.js").catch(() => {
            // Service worker registration is optional for local-first workflows.
          });
        });
      }
    </script>
  </body>
</html>
