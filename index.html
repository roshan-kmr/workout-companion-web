<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Workout Companion is a mobile-friendly gym planner with progress tracking, workout logs, and backup controls." />
    <title>Workout Companion</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="stylesheet" href="styles.css?v=12" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow" id="userPossessiveLabel">USER's</p>
          <h1>Workout Companion</h1>
        </div>
        <button id="menuToggle" class="menu-toggle" type="button" aria-label="Open navigation" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
        <div id="topbarActions" class="topbar-actions">
          <button id="menuClose" class="menu-close" type="button" aria-label="Close navigation">×</button>
          <button class="tab-toggle active" data-tab="workout">Active workout</button>
          <button class="tab-toggle" data-tab="user">User</button>
          <button class="tab-toggle" data-tab="data">Data & backup</button>
        </div>
      </header>

      <main>
        <section id="workoutView" class="tab-view active">
          <div class="panel main-panel">
            <div id="routinesHome">
              <div class="routines-head">
                <div>
                  <p class="section-label">Homepage</p>
                  <h2>Routines</h2>
                  <p class="muted-copy">Choose a routine to open its workout page.</p>
                </div>
              </div>

              <div id="daySelector" class="routine-grid"></div>
            </div>

            <div id="routineDetail" class="routine-detail hidden">
              <div class="detail-head">
                <button id="backToRoutinesBtn" class="secondary-btn">Back to Routines</button>
                <div>
                  <h2 id="routineDetailTitle"></h2>
                  <p id="routineDetailFocus" class="muted-copy"></p>
                </div>
              </div>

              <div id="routineExerciseList" class="routine-exercise-list"></div>

              <div id="selectedRoutineLabel" class="selected-routine-label hidden"></div>
              <button id="startBtn" class="primary-btn hidden">Start workout</button>
              <div id="statsGrid" class="stats-grid hidden"></div>
              <div id="sessionCard" class="session-card hidden"></div>

              <div class="end-routine-row">
                <button id="endRoutineBtn" class="primary-btn end-routine-btn">End routine and save</button>
              </div>
            </div>
          </div>
        </section>

        <section id="userView" class="tab-view hidden">
          <div class="panel side-panel">
            <div class="panel-head">
              <h2>User details</h2>
            </div>

            <div class="user-row">
              <label class="user-label" for="userNameInput">User name</label>
              <input id="userNameInput" class="user-name-input" type="text" placeholder="USER" maxlength="40" />
            </div>

            <div class="mini-card">
              <h3>Profile</h3>
              <div class="status-box">
                <div><strong>Default:</strong> USER</div>
                <div><strong>Display:</strong> <span id="userProfileDisplay">USER's</span></div>
              </div>
            </div>
          </div>
        </section>

        <section id="dataView" class="tab-view hidden">
          <div class="panel side-panel">
            <div class="panel-head">
              <h2>Data & backup</h2>
            </div>

            <div class="data-actions">
              <button id="openFileBtn" class="secondary-btn">Open data file</button>
              <button id="exportBtn" class="secondary-btn">Export</button>
              <button id="importBtn" class="secondary-btn">Import</button>
              <button id="saveNowBtn" class="secondary-btn">Save active file</button>
              <button id="resetBtn" class="secondary-btn danger-btn">Reset</button>
            </div>

            <div class="mini-card">
              <h3>Weekly summary</h3>
              <div id="weeklySummary" class="summary-box"></div>
            </div>

            <div class="mini-card">
              <h3>PRs</h3>
              <ul id="prList" class="pr-list"></ul>
            </div>

            <div class="mini-card">
              <h3>Backup status</h3>
              <div id="backupStatus" class="status-box"></div>
            </div>

            <div class="mini-card">
              <h3>Recent log</h3>
              <ul id="recentLog" class="log-list"></ul>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="app.js?v=13"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("sw.js").catch(() => {
            // Service worker registration is optional for local-first workflows.
          });
        });
      }
    </script>
  </body>
</html>
